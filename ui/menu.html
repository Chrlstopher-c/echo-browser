<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' echo: data:; connect-src 'self'" />
    <title>Menu</title>
    <!-- La page fait exactement la taille du menu : son fond doit disparaitre, sinon
         les angles arrondis laissent voir un rectangle plein. -->
    <style>
      /* Une vue posee au-dessus de la page ne sait pas etre transparente : Chromium
         peint un rectangle plein dessous (mesure le 10/09). Le menu prend donc toute
         la surface, sans angles arrondis qui laisseraient voir la decoupe. */
      html, body { background: var(--color-card); margin: 0; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="racine"></div>
    <script type="module" src="/src/context-menu/main.tsx"></script>
  </body>
</html>
