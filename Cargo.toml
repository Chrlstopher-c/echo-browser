[workspace]
resolver = "3"
members = [
    "core/account",
    "core/contract",
    "core/extensions",
    "core/library",
    "core/network",
    "core/shell",
    "core/shield",
    "core/terminal",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
echo-account    = { path = "core/account" }
echo-contract   = { path = "core/contract" }
echo-shield     = { path = "core/shield" }
echo-tabs       = { path = "core/tabs" }
echo-extensions = { path = "core/extensions" }
echo-library    = { path = "core/library" }
echo-network    = { path = "core/network" }
echo-terminal   = { path = "core/terminal" }
echo-settings   = { path = "core/settings" }

anyhow     = "1"
thiserror  = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
